# 바뀔 수 있는 값은 코드가 아니라 여기에 둡니다. (docs/ARCHITECTURE.md 참고)

# 회차까지 지원하는 작품 — docs/data-sources.md의 "작품 × 출처" 표로 확정
works: []

# 서비스용 DB — 상세 줄거리가 제대로 있는 작품만 수집 DB에서 옮김 (python data/collect.py migrate)
service_db:
  name: aniwhere_service
  min_plot_fill: 0.8        # 500자 이상 상세 줄거리가 있는 회차 ÷ 전체 회차가 이 이상인 작품만

embedding:
  # data/collect.py embed가 쓰는 모델 (한국어 질문 ↔ 영어 줄거리 검색용 다국어 모델, 로컬 실행)
  model: BAAI/bge-m3
  dim: 1024                 # data/schema.sql의 vector(N)과 같아야 함
  passage_prefix: ""        # e5 계열은 청크·질문 앞에 "passage: " / "query: "를 붙임. bge-m3는 붙이지 않음
  query_prefix: ""
  max_seq_length: 8192      # 이보다 긴 글은 뒤가 잘림 (bge-m3의 최대). 회차 통째 줄거리는 대부분 이 안에 들어감
  fp16: true                # GPU(Apple Silicon 포함)에서 반정밀도로 계산. 결과는 거의 같고(코사인 0.9997) 4배쯤 빠름
  batch_size: 32            # 한 번에 넣는 청크 수의 최대
  max_batch_chars: 32000    # 한 번에 넣는 글자 수의 최대. 긴 글은 이 값에 맞춰 개수를 줄임 (메모리 부족 방지)

chunking:
  strategy: memory_unit   # memory_unit(기억 단위) | fixed(고정 길이, 비교용)

retrieval:
  top_k: 5
  chunk_types: [plot]       # 벡터 검색 대상. 임베딩한 종류만 적음 (지금은 회차 통째 줄거리만 임베딩)
  query_device: cpu         # 질문 임베딩을 계산할 장치. null이면 자동(GPU). 청크 임베딩(embed)이 GPU를 쓰는 동안에도 돌도록 cpu

# 02 탐색 — 기억으로 작품·회차 찾기 (aniwhere/agent/find.py)
find:
  pool: 30                  # 작품을 모를 때 전체에서 먼저 가져오는 청크 수
  max_series: 4             # 회차까지 다시 검색하는 작품 후보 수
  min_score: 0.5            # 1위 유사도가 이보다 낮으면 근거가 약하다고 보고 단정하지 않음
  margin: 0.02              # 1위와 2위의 유사도 차이가 이보다 작으면 후보가 비슷하다고 보고 다시 물음 (LLM이 없을 때)
  judge_chunks: 8           # LLM에게 보여 주는 후보 회차 수
  judge_chunk_chars: 8000   # 후보 청크 하나에서 보여 주는 글자 수 (회차 줄거리는 길면 7~8천 자)

# 04 이어보기 — 맞춤 복습 (aniwhere/agent/review.py)
review:
  max_context_chars: 60000  # LLM에 넣는 근거의 최대 글자 수. 회차가 많으면 회차당 글자 수를 줄여 맞춤
  source_chars: 400         # 응답의 sources[].text 한 개 길이

# 01 입문 — 취향 인터뷰 추천 (aniwhere/agent/recommend.py)
recommend:
  count: 5

llm:
  model: gpt-4o-mini        # OpenAI 모델 이름. 키는 .env의 OPENAI_API_KEY
  temperature: 0            # 이 값을 받지 않는 모델이면 null
